# Fallback: if Cycle.xcodeproj doesn't open in your Xcode, regenerate it with XcodeGen:
#   brew install xcodegen && cd ios && xcodegen
name: Cycle
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
targets:
  Cycle:
    type: application
    platform: iOS
    sources:
      - path: Cycle
        excludes: ["Info.plist", "Cycle.entitlements"]
    info:
      path: Cycle/Info.plist
    entitlements:
      path: Cycle/Cycle.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cycle
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: NO
        DEVELOPMENT_TEAM: ""
